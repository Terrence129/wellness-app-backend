spring.application.name=wellness-app-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wellness-app?useSSL=false&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.issuer=${JWT_ISSUER:wellness-app-backend}
app.jwt.audience=${JWT_AUDIENCE:wellness-android}
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_SECRET_KEY_AT_LEAST_32_CHARS_qwertyuiopasdfghjkl}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.ai.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:10}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2}
