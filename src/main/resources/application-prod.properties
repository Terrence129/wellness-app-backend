spring.application.name=wellness-app-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wellness-app?useSSL=false&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.issuer=${JWT_ISSUER:wellness-app-backend}
app.jwt.audience=${JWT_AUDIENCE:wellness-android}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:5}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
